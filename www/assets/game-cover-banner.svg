<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="55%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="sunGlow" cx="88%" cy="16%" r="35%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FEF08A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </radialGradient>

    <!-- Rolling Hills Gradients -->
    <linearGradient id="backHill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="frontHill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- Snake Mascot Gradients -->
    <radialGradient id="snakeHeadGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#85EA46"/>
      <stop offset="60%" stop-color="#4ECB23"/>
      <stop offset="100%" stop-color="#26850E"/>
    </radialGradient>
    <radialGradient id="snakeBodyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#85EA46"/>
      <stop offset="55%" stop-color="#4ECB23"/>
      <stop offset="100%" stop-color="#227A0B"/>
    </radialGradient>

    <!-- Fruit Gradients -->
    <radialGradient id="strawberryGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="65%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </radialGradient>
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Cloud Shadow -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#047857" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="260" fill="url(#skyGrad)"/>

  <!-- Sun Glow -->
  <circle cx="530" cy="40" r="110" fill="url(#sunGlow)"/>

  <!-- Background Clouds -->
  <g filter="url(#cloudShadow)" fill="#FFFFFF" opacity="0.92">
    <!-- Left Cloud -->
    <path d="M 45 48 A 16 16 0 0 1 73 38 A 24 24 0 0 1 112 44 A 18 18 0 0 1 128 62 A 16 16 0 0 1 112 76 L 45 76 A 14 14 0 0 1 45 48 Z"/>
    <!-- Center-Right Cloud -->
    <path d="M 430 42 A 18 18 0 0 1 462 30 A 28 28 0 0 1 508 38 A 20 20 0 0 1 528 58 L 430 58 A 16 16 0 0 1 430 42 Z"/>
  </g>

  <!-- Distant Hill -->
  <path d="M 0 260 L 0 175 Q 140 145 280 178 T 600 162 L 600 260 Z" fill="url(#backHill)"/>

  <!-- Foreground Lush Hill -->
  <path d="M 0 260 L 0 198 Q 150 170 300 202 T 600 188 L 600 260 Z" fill="url(#frontHill)"/>

  <!-- Little Meadow Flowers / Daisies -->
  <g fill="#FFFFFF">
    <circle cx="65" cy="208" r="3.5"/><circle cx="60" cy="204" r="3"/><circle cx="70" cy="204" r="3"/><circle cx="65" cy="200" r="3"/><circle cx="65" cy="204" r="2.2" fill="#FBBF24"/>
    <circle cx="160" cy="216" r="3.5"/><circle cx="155" cy="212" r="3"/><circle cx="165" cy="212" r="3"/><circle cx="160" cy="208" r="3"/><circle cx="160" cy="212" r="2.2" fill="#FBBF24"/>
    <circle cx="460" cy="212" r="3.5"/><circle cx="455" cy="208" r="3"/><circle cx="465" cy="208" r="3"/><circle cx="460" cy="204" r="3"/><circle cx="460" cy="208" r="2.2" fill="#FBBF24"/>
    <circle cx="545" cy="204" r="3.5"/><circle cx="540" cy="200" r="3"/><circle cx="550" cy="200" r="3"/><circle cx="545" cy="196" r="3"/><circle cx="545" cy="200" r="2.2" fill="#FBBF24"/>
  </g>

  <!-- Floating Twinkle Golden Stars -->
  <g fill="#F59E0B">
    <path d="M 120 75 Q 120 83 128 83 Q 120 83 120 91 Q 120 83 112 83 Q 120 83 120 75 Z"/>
    <path d="M 230 42 Q 230 48 236 48 Q 230 48 230 54 Q 230 48 224 48 Q 230 48 230 42 Z"/>
    <path d="M 405 60 Q 405 67 412 67 Q 405 67 405 74 Q 405 67 398 67 Q 405 67 405 60 Z"/>
    <path d="M 525 90 Q 525 96 531 96 Q 525 96 525 102 Q 525 96 519 96 Q 525 96 525 90 Z"/>
  </g>

  <!-- ==================== MAIN CHARACTERS & OBJECTS ==================== -->
  
  <!-- Left Collectible: Shiny Strawberry Fruit -->
  <g transform="translate(130, 160)" filter="url(#badgeShadow)">
    <!-- Shadow -->
    <ellipse cx="0" cy="28" rx="16" ry="6" fill="#166534" opacity="0.22"/>
    <!-- Strawberry body -->
    <path d="M 0 -14 C 18 -14 22 8 0 24 C -22 8 -18 -14 0 -14 Z" fill="url(#strawberryGrad)"/>
    <!-- Seeds -->
    <circle cx="-6" cy="-2" r="1.4" fill="#FEF08A"/>
    <circle cx="6" cy="-2" r="1.4" fill="#FEF08A"/>
    <circle cx="0" cy="7" r="1.4" fill="#FEF08A"/>
    <circle cx="-4" cy="14" r="1.2" fill="#FEF08A"/>
    <circle cx="4" cy="14" r="1.2" fill="#FEF08A"/>
    <!-- Specular shine -->
    <ellipse cx="-6" cy="-6" rx="5" ry="2.8" transform="rotate(-30 -6 -6)" fill="#FFFFFF" opacity="0.65"/>
    <!-- Leaves on top -->
    <path d="M 0 -14 L -9 -20 L -3 -16 L 0 -23 L 3 -16 L 9 -20 Z" fill="#22C55E"/>
  </g>

  <!-- Right Collectible: Golden Apple Fruit -->
  <g transform="translate(470, 162)" filter="url(#badgeShadow)">
    <!-- Shadow -->
    <ellipse cx="0" cy="26" rx="16" ry="6" fill="#166534" opacity="0.22"/>
    <!-- Apple body -->
    <path d="M 0 -12 C 16 -18 24 4 14 18 C 6 25 -6 25 -14 18 C -24 4 -16 -18 0 -12 Z" fill="url(#appleGrad)"/>
    <!-- Specular highlight -->
    <ellipse cx="-7" cy="-5" rx="6" ry="3" transform="rotate(-25 -7 -5)" fill="#FFFFFF" opacity="0.7"/>
    <!-- Apple stem & green leaf -->
    <path d="M 0 -12 Q 2 -18 6 -20" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 3 -18 Q 12 -22 13 -16 Q 8 -14 3 -18 Z" fill="#4ADE80"/>
  </g>

  <!-- ==================== PROMINENT CARTOON SNAKE MASCOT ==================== -->
  <g id="snake-mascot" filter="url(#badgeShadow)">
    
    <!-- Under-Snake Soft Ground Shadow -->
    <ellipse cx="300" cy="216" rx="90" ry="14" fill="#166534" opacity="0.28"/>

    <!-- Continuous Plump Curved Snake Body Segments (Coiled happily) -->
    <!-- Segment 8 (Tail tip) -->
    <circle cx="205" cy="192" r="11" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="205" cy="194" rx="9" ry="5" fill="#FFF3A3"/>

    <!-- Segment 7 -->
    <circle cx="225" cy="198" r="14" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="225" cy="201" rx="11" ry="6" fill="#FFF3A3"/>

    <!-- Segment 6 -->
    <circle cx="248" cy="203" r="17" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="248" cy="206" rx="13" ry="7" fill="#FFF3A3"/>

    <!-- Segment 5 -->
    <circle cx="274" cy="205" r="19" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="274" cy="208" rx="15" ry="8" fill="#FFF3A3"/>

    <!-- Segment 4 (Looping up) -->
    <circle cx="305" cy="202" r="21" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="305" cy="205" rx="16" ry="8.5" fill="#FFF3A3"/>

    <!-- Segment 3 -->
    <circle cx="335" cy="193" r="22" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="335" cy="196" rx="17" ry="9" fill="#FFF3A3"/>

    <!-- Segment 2 (Neck curve upward) -->
    <circle cx="355" cy="172" r="23" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="355" cy="175" rx="17" ry="9" fill="#FFF3A3"/>

    <!-- Segment 1 (Supporting head) -->
    <circle cx="352" cy="144" r="25" fill="url(#snakeBodyGrad)"/>
    <ellipse cx="352" cy="147" rx="18" ry="9" fill="#FFF3A3"/>

    <!-- Cartoon Snake Head (Big, smiling, cheerful) -->
    <g id="snake-head">
      <!-- Head Base -->
      <ellipse cx="330" cy="115" rx="36" ry="32" fill="url(#snakeHeadGrad)"/>
      <!-- Snout & Under-jaw / Cream Belly -->
      <ellipse cx="320" cy="128" rx="26" ry="16" fill="#FFF3A3"/>

      <!-- Friendly Smile Line -->
      <path d="M 302 124 Q 318 136 338 126" stroke="#227A0B" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Cute Pink Forked Tongue Peeking Out -->
      <path d="M 324 133 Q 328 143 332 148 L 338 144 M 332 148 L 334 153" stroke="#FF6B8B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Rosy Cheeks -->
      <circle cx="298" cy="122" r="7.5" fill="#FF7E98" opacity="0.85"/>
      <circle cx="344" cy="120" r="7.5" fill="#FF7E98" opacity="0.85"/>

      <!-- Big Expressive Cartoon Left Eye -->
      <g id="left-eye">
        <ellipse cx="312" cy="100" rx="10.5" ry="13" fill="#FFFFFF"/>
        <ellipse cx="314" cy="101" rx="7.5" ry="9.5" fill="#1E1B24"/>
        <!-- Star / Highlights in Pupil -->
        <circle cx="311.5" cy="97" r="3.2" fill="#FFFFFF"/>
        <circle cx="316" cy="105" r="1.6" fill="#FFFFFF"/>
      </g>

      <!-- Big Expressive Cartoon Right Eye -->
      <g id="right-eye">
        <ellipse cx="336" cy="98" rx="10.5" ry="13" fill="#FFFFFF"/>
        <ellipse cx="337" cy="99" rx="7.5" ry="9.5" fill="#1E1B24"/>
        <!-- Star / Highlights in Pupil -->
        <circle cx="334.5" cy="95" r="3.2" fill="#FFFFFF"/>
        <circle cx="339" cy="103" r="1.6" fill="#FFFFFF"/>
      </g>

      <!-- Glossy Curved Highlights on Top of Head -->
      <ellipse cx="325" cy="90" rx="14" ry="5" transform="rotate(-10 325 90)" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Glossy Highlights on Body Segments -->
    <ellipse cx="270" cy="194" rx="7" ry="3" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="302" cy="189" rx="8" ry="3.5" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- ==================== 3D GAME TITLE BADGE BANNER ==================== -->
  <g id="title-badge" transform="translate(180, 52)" filter="url(#badgeShadow)">
    
    <!-- Title Background Banner Pill -->
    <rect x="-85" y="-30" width="220" height="48" rx="24" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2.5"/>
    
    <!-- Subtle Inner Glow -->
    <rect x="-83" y="-28" width="216" height="44" rx="22" fill="#F0F9FF"/>

    <!-- Mini Mascot Emblem Inside Pill -->
    <circle cx="-62" cy="-6" r="16" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
    <path d="M -70 -2 Q -66 -10 -60 -7 Q -56 -4 -54 -10" stroke="#4ECB23" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="-53" cy="-11" r="3" fill="#4ECB23"/>
    <circle cx="-54" cy="-12" r="1.2" fill="#FFFFFF"/>

    <!-- Main Game Title Text "NEON SNAKE" -->
    <text x="-36" y="-2" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#1E293B" letter-spacing="1">
      NEON SNAKE
    </text>

    <!-- Subtitle Pill -->
    <text x="-36" y="11" font-family="'Outfit', sans-serif" font-weight="700" font-size="8" fill="#059669" letter-spacing="1.4">
      CASUAL ARCADE ADVENTURE
    </text>
  </g>

</svg>
